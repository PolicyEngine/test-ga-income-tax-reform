# Dashboard Implementation Plan
# Generated by dashboard-planner agent

dashboard:
  name: "ga-income-tax-reform"
  title: "Georgia income tax & child tax credit reform calculator"
  description: >
    An interactive calculator that lets users model the impact of Georgia's
    flat income tax rate and new Child Tax Credit on their household and on
    the state as a whole. Users configure their household (filing status,
    ages, dependents, income) and adjust reform parameters (tax rate,
    standard deduction, CTC amount, age threshold, refundability, phase-out).
    The tool shows household-level impacts via line and waterfall charts,
    plus statewide impacts via microsimulation (revenue change, winners/losers,
    poverty, distributional analysis).
  country: us
  audience: public

data_pattern: custom-modal

custom_modal:
  reason: >
    The dashboard requires two capabilities that simpler patterns cannot provide:
    (1) Custom reform parameters — users vary the GA flat tax rate, standard
    deduction, CTC amount, age threshold, refundability, and phase-out, which
    are not exposed as configurable inputs in the PolicyEngine household API.
    These require programmatic reform application via policyengine-us Simulation.
    (2) Microsimulation — the "Statewide impact" tab needs population-level
    analysis (revenue change, winners/losers, poverty, decile impacts), which
    requires running policyengine-us Microsimulation with the Enhanced CPS
    dataset. Neither the precomputed nor the API pattern supports arbitrary
    reform microsimulation.
  policyengine_package: policyengine-us
  backend_pattern: fastapi-modal-asgi
  # Follow the ACA-Calc pattern: FastAPI app deployed via modal.asgi_app()
  # with @modal.concurrent for parallel request handling.

  # ──────────────────────────────────────────────────────────────────────
  # IMPORTANT: Verified parameter structure notes for the builder agent
  # ──────────────────────────────────────────────────────────────────────
  #
  # GA tax rate structure:
  #   The GA income tax uses a BRACKET structure with 6 brackets at
  #   gov.states.ga.tax.income.main.{filing_status}
  #   As of 2025, ALL 6 brackets are set to the same flat rate (5.19%).
  #   To change the flat rate, the reform must update ALL bracket rates.
  #   Example bracket path:
  #     gov.states.ga.tax.income.main.single.brackets[N].rate
  #   where N = 0..5, all set to the same value.
  #
  # GA standard deduction:
  #   gov.states.ga.tax.income.deductions.standard.amount
  #   Filing-status-indexed: SINGLE=$12,000, JOINT=$24,000,
  #   HEAD_OF_HOUSEHOLD=$12,000, SEPARATE=$12,000 (as of 2024+).
  #
  # GA CTC:
  #   gov.states.ga.tax.income.credits.ctc.amount = $250 (effective 2026-01-01)
  #   gov.states.ga.tax.income.credits.ctc.age_threshold = 6 (effective 2026-01-01)
  #   The CTC is currently NON-REFUNDABLE (subtracted at the
  #   ga_income_tax_before_refundable_credits level).
  #   Making it refundable requires a reform modifier that moves ga_ctc
  #   from non-refundable to refundable credits.
  #   There is NO phase-out parameter in current law. Adding phase-out
  #   requires a custom variable or reform modifier.
  #
  # Household computation approach:
  #   Use the policyengine-us "axes" pattern to sweep employment_income
  #   from 0 to 500k in a single Simulation call (like ACA-Calc).
  #   This generates the full earnings-axis data in one call rather than
  #   running hundreds of separate simulations.

  endpoints:
    - name: household-impact
      method: POST
      description: >
        Computes household-level tax and benefit results across a range of
        earnings levels for both baseline and reform scenarios. Uses the
        policyengine-us axes pattern to sweep employment_income in a single
        Simulation call. Returns arrays suitable for line charts plus a
        summary at the user's specific income level.
      inputs:
        - name: filing_status
          type: string
          enum: [single, joint, head_of_household]
        - name: head_age
          type: integer
          default: 40
        - name: spouse_age
          type: integer
          default: 40
          description: Only used when filing_status is joint
        - name: dependent_ages
          type: array[integer]
          default: []
        - name: income
          type: number
          description: The user's specific annual income for the summary card
        - name: reform
          type: object
          properties:
            - name: ga_tax_rate
              type: number
              default: 0.0519
              description: Flat GA income tax rate (0 to 0.0575)
            - name: standard_deduction
              type: number
              default: null
              description: If null, uses current-law default for filing status
            - name: ctc_amount
              type: number
              default: 250
              description: GA CTC per qualifying child
            - name: ctc_max_age
              type: integer
              default: 6
              description: Children must be younger than this age
            - name: ctc_refundable
              type: boolean
              default: false
            - name: ctc_phaseout_threshold
              type: number
              default: null
              description: AGI above which CTC phases out (null = no phase-out)
            - name: ctc_phaseout_rate
              type: number
              default: null
              description: Rate at which CTC phases out per dollar above threshold
      outputs:
        - name: earnings_axis
          type: array[number]
          description: Array of earnings levels (0 to 500k, ~100 points)
        - name: baseline_net_income
          type: array[number]
        - name: reform_net_income
          type: array[number]
        - name: baseline_mtr
          type: array[number]
          description: Baseline marginal tax rates at each earnings level
        - name: reform_mtr
          type: array[number]
          description: Reform marginal tax rates at each earnings level
        - name: summary
          type: object
          description: Results at the user's specific income level
          properties:
            - name: baseline_state_tax
              type: number
            - name: reform_state_tax
              type: number
            - name: baseline_ctc
              type: number
            - name: reform_ctc
              type: number
            - name: baseline_net_income
              type: number
            - name: reform_net_income
              type: number
            - name: net_change
              type: number
      policyengine_variables:
        - employment_income
        - ga_income_tax       # TaxUnit — GA income tax after refundable credits
        - ga_ctc              # TaxUnit — Georgia Child Tax Credit
        - household_net_income
        - household_tax
        - household_benefits
        - household_market_income
        - state_income_tax
      policyengine_parameters:
        - gov.states.ga.tax.income.main.single       # 6 brackets, all same rate
        - gov.states.ga.tax.income.main.joint         # 6 brackets, all same rate
        - gov.states.ga.tax.income.main.head_of_household  # 6 brackets, all same rate
        - gov.states.ga.tax.income.main.separate      # 6 brackets, all same rate
        - gov.states.ga.tax.income.main.surviving_spouse   # 6 brackets, all same rate
        - gov.states.ga.tax.income.deductions.standard.amount  # filing-status-indexed
        - gov.states.ga.tax.income.credits.ctc.amount
        - gov.states.ga.tax.income.credits.ctc.age_threshold

    - name: statewide-impact
      method: POST
      description: >
        Runs microsimulation comparing baseline to reform using the Enhanced
        CPS dataset. Returns aggregate revenue change, winner/loser counts,
        poverty impact, and decile-level average income changes.
        This endpoint is expensive (~30-60s). Consider implementing Modal
        Dict caching (like ACA-Calc) with a hash of reform params as key.
      inputs:
        - name: reform
          type: object
          description: Same reform object as household-impact endpoint
      outputs:
        - name: revenue_change
          type: number
          description: Total state revenue change in dollars
        - name: winners
          type: integer
          description: Number of households with higher net income under reform
        - name: losers
          type: integer
          description: Number of households with lower net income under reform
        - name: unchanged
          type: integer
          description: Number of households unaffected
        - name: poverty_rate_change
          type: number
          description: Change in poverty rate (percentage points)
        - name: child_poverty_rate_change
          type: number
          description: Change in child poverty rate (percentage points)
        - name: decile_impacts
          type: array[object]
          description: >
            Array of 10 objects, one per income decile, each with
            decile (1-10), avg_income_change, and pct_change fields
      policyengine_variables:
        - household_net_income
        - in_poverty
        - is_child
        - household_income_decile
        - state_income_tax
        - ga_income_tax
        - ga_ctc

tech_stack:
  # Fixed - not configurable
  framework: react-nextjs
  ui: "@policyengine/ui-kit"
  styling: tailwind-with-design-tokens
  font: inter
  testing: vitest
  charts: recharts
  state_management: "@tanstack/react-query"
  http_client: axios
  # Note: @policyengine/ui-kit must be added to package.json (currently missing)
  # Run: bun add @policyengine/ui-kit

components:
  # ─── LEFT SIDEBAR ───
  - type: input_form
    id: household-config
    section: sidebar
    title: "Household configuration"
    accordion: true
    fields:
      - name: filing_status
        input_type: select
        label: "Filing status"
        options:
          - { value: "single", label: "Single" }
          - { value: "joint", label: "Married filing jointly" }
          - { value: "head_of_household", label: "Head of household" }
        default: "single"

      - name: head_age
        input_type: number
        label: "Your age"
        min: 18
        max: 100
        default: 40

      - name: spouse_age
        input_type: number
        label: "Spouse's age"
        min: 18
        max: 100
        default: 40
        visible_when: "filing_status === 'joint'"

      - name: num_dependents
        input_type: number
        label: "Number of dependents"
        min: 0
        max: 10
        default: 0

      - name: dependent_ages
        input_type: dynamic_array
        label: "Dependent ages"
        item_label: "Dependent {n} age"
        min: 0
        max: 18
        default: 5
        count_field: num_dependents

      - name: income
        input_type: slider
        label: "Annual employment income"
        min: 0
        max: 500000
        default: 50000
        step: 1000
        format: currency

  - type: input_form
    id: reform-params
    section: sidebar
    title: "Reform parameters"
    accordion: true
    subsections:
      - title: "Georgia income tax"
        fields:
          - name: ga_tax_rate
            input_type: slider
            label: "Flat income tax rate"
            min: 0
            max: 0.0575
            default: 0.0519
            step: 0.0001
            format: percent
            description: "Current law: 5.19% (2025)"

          - name: standard_deduction
            input_type: number
            label: "Standard deduction"
            min: 0
            max: 100000
            step: 100
            format: currency
            default_dynamic: >
              filing_status === 'joint' ? 24000 : 12000
            description: "Current law: $12,000 single / $24,000 joint"

      - title: "Georgia child tax credit"
        fields:
          - name: ctc_amount
            input_type: number
            label: "Credit amount per child"
            min: 0
            max: 10000
            step: 50
            default: 250
            format: currency

          - name: ctc_max_age
            input_type: number
            label: "Maximum qualifying age"
            min: 1
            max: 18
            default: 6

          - name: ctc_refundable
            input_type: toggle
            label: "Make credit refundable"
            default: false

          - name: ctc_phaseout_threshold
            input_type: number
            label: "AGI phase-out threshold"
            min: 0
            max: 500000
            step: 1000
            format: currency
            default: null
            placeholder: "None (no phase-out)"
            optional: true

          - name: ctc_phaseout_rate
            input_type: number
            label: "Phase-out rate"
            min: 0
            max: 1
            step: 0.01
            format: percent
            default: null
            placeholder: "e.g. 5%"
            optional: true
            visible_when: "ctc_phaseout_threshold !== null"

  # ─── MAIN CONTENT: TAB 1 - HOUSEHOLD IMPACT ───
  - type: tab_container
    id: main-tabs
    section: main
    tabs:
      - id: household-impact
        label: "Household impact"
      - id: statewide-impact
        label: "Statewide impact"

  - type: chart
    id: net-income-by-earnings
    tab: household-impact
    chart_type: line
    component_ref: "app-v2:ChartContainer"
    title: "Net income by earnings level"
    description: "Compares household net income under baseline and reform across earnings"
    x:
      variable: earnings_axis
      label: "Employment income"
      format: currency
    y:
      - variable: baseline_net_income
        label: "Baseline"
        color: chart-5
        stroke_style: dashed
      - variable: reform_net_income
        label: "Reform"
        color: chart-1
    annotation:
      type: vertical_line
      variable: income
      label: "Your income"
      color: muted-foreground
      stroke_style: dotted
    responsive:
      mobile_height: 250
      desktop_height: 400

  - type: metric_card
    id: household-summary
    tab: household-impact
    title: "Your household impact"
    layout: grid-2x3
    metrics:
      - label: "State tax (baseline)"
        value_variable: summary.baseline_state_tax
        format: currency
      - label: "State tax (reform)"
        value_variable: summary.reform_state_tax
        format: currency
      - label: "GA CTC (baseline)"
        value_variable: summary.baseline_ctc
        format: currency
      - label: "GA CTC (reform)"
        value_variable: summary.reform_ctc
        format: currency
      - label: "Net income change"
        value_variable: summary.net_change
        format: currency_signed
        color_rule: "positive=chart-1, negative=destructive"

  - type: chart
    id: marginal-rate-waterfall
    tab: household-impact
    chart_type: line
    component_ref: "app-v2:ChartContainer"
    title: "Marginal tax rate comparison"
    description: "Shows marginal tax rates under baseline and reform across earnings"
    x:
      variable: earnings_axis
      label: "Employment income"
      format: currency
    y:
      - variable: baseline_mtr
        label: "Baseline MTR"
        color: chart-5
        stroke_style: dashed
      - variable: reform_mtr
        label: "Reform MTR"
        color: chart-1
    y_axis:
      format: percent
      domain: [0, 0.6]
    responsive:
      mobile_height: 250
      desktop_height: 400

  # ─── MAIN CONTENT: TAB 2 - STATEWIDE IMPACT ───
  - type: metric_card
    id: statewide-summary
    tab: statewide-impact
    title: "Statewide impact summary"
    layout: grid-2x2
    metrics:
      - label: "Revenue change"
        value_variable: revenue_change
        format: currency_billions
        color_rule: "positive=chart-1, negative=destructive"
      - label: "Winners"
        value_variable: winners
        format: number_compact
      - label: "Losers"
        value_variable: losers
        format: number_compact
      - label: "Poverty rate change"
        value_variable: poverty_rate_change
        format: percentage_points
        color_rule: "negative=chart-1, positive=destructive"

  - type: metric_card
    id: poverty-detail
    tab: statewide-impact
    title: "Poverty impact"
    layout: grid-1x2
    metrics:
      - label: "Overall poverty rate change"
        value_variable: poverty_rate_change
        format: percentage_points
      - label: "Child poverty rate change"
        value_variable: child_poverty_rate_change
        format: percentage_points

  - type: chart
    id: decile-chart
    tab: statewide-impact
    chart_type: bar
    component_ref: "app-v2:ChartContainer"
    title: "Average income change by decile"
    description: "Shows how the reform affects households across the income distribution"
    x:
      variable: decile
      label: "Income decile"
      format: ordinal
    y:
      - variable: avg_income_change
        label: "Average income change"
        color: chart-1
        color_rule: "negative_bars=destructive"
    responsive:
      mobile_height: 250
      desktop_height: 350

embedding:
  register_in_apps_json: true
  display_with_research: true
  slug: "ga-income-tax-reform"
  tags: ["us", "policy", "interactives", "state"]

tests:
  api_tests:
    - name: "single_filer_baseline"
      description: "Single filer at $50k income, default reform params should return valid results"
      input:
        filing_status: "single"
        head_age: 40
        dependent_ages: []
        income: 50000
        reform:
          ga_tax_rate: 0.0519
          standard_deduction: 12000
          ctc_amount: 250
          ctc_max_age: 6
          ctc_refundable: false
      expected:
        summary:
          baseline_state_tax:
            min: 1000
            max: 3000
          reform_state_tax:
            min: 1000
            max: 3000
          net_change:
            equals: 0
            tolerance: 1

    - name: "rate_reduction_benefit"
      description: "Reducing rate from 5.19% to 4% should reduce tax liability"
      input:
        filing_status: "single"
        head_age: 40
        dependent_ages: []
        income: 75000
        reform:
          ga_tax_rate: 0.04
          standard_deduction: 12000
          ctc_amount: 250
          ctc_max_age: 6
          ctc_refundable: false
      expected:
        summary:
          net_change:
            min: 0
          reform_state_tax:
            less_than: summary.baseline_state_tax

    - name: "ctc_with_young_children"
      description: "Family with children under 6 should receive GA CTC"
      input:
        filing_status: "joint"
        head_age: 35
        spouse_age: 33
        dependent_ages: [3, 5, 10]
        income: 80000
        reform:
          ga_tax_rate: 0.0519
          standard_deduction: 24000
          ctc_amount: 500
          ctc_max_age: 6
          ctc_refundable: false
      expected:
        summary:
          reform_ctc:
            equals: 1000
            tolerance: 10
            description: "Two children under 6 at $500 each"

    - name: "zero_income_zero_tax"
      description: "Zero income should produce zero state tax"
      input:
        filing_status: "single"
        head_age: 30
        dependent_ages: []
        income: 0
        reform:
          ga_tax_rate: 0.0519
          standard_deduction: 12000
          ctc_amount: 250
          ctc_max_age: 6
          ctc_refundable: false
      expected:
        summary:
          baseline_state_tax: 0
          reform_state_tax: 0

    - name: "statewide_default_params"
      description: "Statewide impact with current-law defaults should show near-zero changes"
      endpoint: statewide-impact
      input:
        reform:
          ga_tax_rate: 0.0519
          standard_deduction: null
          ctc_amount: 250
          ctc_max_age: 6
          ctc_refundable: false
      expected:
        revenue_change:
          min: -1000000
          max: 1000000
          description: "Near zero since reform matches baseline"

  frontend_tests:
    - name: "renders_without_errors"
      description: "All components mount successfully with default state"
    - name: "sidebar_accordion_toggles"
      description: "Household and reform accordion sections expand/collapse"
    - name: "charts_receive_data"
      description: "Line and bar charts render with correct data shape after API response"
    - name: "tab_switching"
      description: "Switching between Household impact and Statewide impact tabs works"
    - name: "input_validation"
      description: "Form rejects invalid inputs (negative income, rate > 5.75%, etc.)"
    - name: "spouse_field_visibility"
      description: "Spouse age field appears only when filing status is joint"
    - name: "dependent_age_fields"
      description: "Correct number of dependent age inputs render based on num_dependents"
    - name: "slider_updates_value"
      description: "Tax rate slider updates displayed percentage in real time"

  design_compliance:
    - name: "uses_design_tokens"
      description: "No hardcoded colors — all from @policyengine/ui-kit theme CSS variables"
    - name: "inter_font"
      description: "Inter font loaded via Google Fonts CDN and applied via var(--font-sans)"
    - name: "sentence_case"
      description: "All headings and labels use sentence case"
    - name: "responsive_breakpoints"
      description: "Layout adapts at 768px (sidebar collapses) and 480px (fields stack)"
    - name: "recharts_tokens"
      description: "All Recharts fill/stroke use var(--chart-N) pattern, not hex values"
    - name: "negative_currency_format"
      description: "Negative dollar values display as -$100, not $-100"
    - name: "niceticks_and_auto_domain"
      description: "All Recharts axes use niceTicks with domain=['auto','auto']"

  embedding_tests:
    - name: "country_detection"
      description: "Reads country from #country= hash parameter"
    - name: "hash_sync"
      description: "Input changes update URL hash and postMessage to parent"
    - name: "share_urls"
      description: "Share URLs point to policyengine.org, not Vercel"
